name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one but
# never interrupts a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The build type-checks (tsc --noEmit) before it bundles, and the
      # suite covers the game logic; neither is worth publishing past.
      #
      # The compose+bake micro-benchmark is left out on purpose: it
      # asserts a wall-clock budget, which a shared runner cannot hold
      # to. It stays a local guard (`npm test` runs it) rather than a
      # deploy gate that fails on how busy the machine was.
      - run: npx vitest run --exclude '**/node_modules/**' --exclude '**/bakeBench.test.ts'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
